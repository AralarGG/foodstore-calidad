# Controles que corren antes de cada commit, en este orden:
# 1. Formatter (Black), 2. Linter (Flake8), 3. Pruebas unitarias (pytest).
# fail_fast: el primer control que falla corta la cadena y aborta el commit.
fail_fast: true

repos:
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black
        name: Formatter (Black)

  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        name: Linter (Flake8)

  - repo: local
    hooks:
      - id: pytest
        name: Pruebas unitarias (pytest)
        entry: pytest -q
        language: python
        additional_dependencies: [pytest]
        pass_filenames: false
        always_run: true
